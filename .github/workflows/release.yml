name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained app
        run: >
          dotnet publish src/StarHealth.App/StarHealth.App.csproj
          -c Release -r win-x64 --self-contained
          -p:WindowsAppSDKSelfContained=true
          -p:InformationalVersion="${{ github.ref_name }}"
          --nologo -v q

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: >
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          /DAppVersion="${{ github.ref_name }}"
          installer/StarHealth.iss

      - name: Hash installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer/output/*.exe | Select-Object -First 1
          ((Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $exe.Name) | Out-File "$($exe.FullName).sha256" -Encoding ascii -NoNewline

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*
          generate_release_notes: false
          name: "${{ github.ref_name }}"
          body: |
            StarHealth ${{ github.ref_name }}
            Windows installer (self-contained, WinUI 3)

            **First launch:** Windows SmartScreen may warn (unsigned alpha). Click **More info** → **Run anyway**.
